apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn
  labels:
    app: vpn
spec:
  replicas: 1
  # Tor holds a lock on its DataDirectory, and that is now a hostPath shared by any pod of
  # this deployment. A rolling update would stand the new pod up while the old one still
  # holds the lock, so it could never go ready and the rollout would wedge permanently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn
  template:
    metadata:
      labels:
        app: vpn
    spec:
      volumes:
        - name: tor-data
          hostPath:
            path: /var/make-movies-vpn
            type: DirectoryOrCreate
      containers:
        - name: vpn
          image: "ghcr.io/axle-h/make-movies-vpn:latest"
          imagePullPolicy: Always
          ports:
            - name: socks
              containerPort: 9050
          # Keeps the cached consensus and, more importantly, the guard set across restarts.
          # Rebuilding guards on every restart is both slow and bad for anonymity. A fresh
          # hostPath arrives root owned and tor will not start on a DataDirectory it does not
          # own, so the image entrypoint takes it over and drops back to tor.
          volumeMounts:
            - name: tor-data
              mountPath: /var/lib/tor
          # tor-health asks tor's own control port whether it can build circuits, so nothing
          # here depends on a third party site staying happy to serve tor exit traffic. The
          # previous probe fetched ipinfo.io, which now answers 403 to exit nodes, so it
          # failed every single time and restarted a healthy tor roughly every three minutes.
          #
          # It is a local socket round trip, single digit milliseconds, but set an explicit
          # timeoutSeconds anyway: it defaults to 1s and that default is what made the old
          # probe unsurvivable.
          startupProbe:
            exec:
              command: ["/usr/local/bin/tor-health"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60   # up to 5 minutes to bootstrap, it normally takes under 10s
          livenessProbe:
            exec:
              command: ["/usr/local/bin/tor-health"]
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5    # tor recovers circuits on its own, only restart if it stays down
